name: '[CI/CD] CI Pipeline'

on: # rebuild any PRs and main branch changes
  pull_request_target:
    types:
      - synchronize
      - labeled
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  IMAGE_NAME: jtgasper3/bitnami-openldap
  LATEST_OPENLDAP_VERSION: 2.6.14
  # Debian flavour whose images own the unsuffixed tags (latest, 2.6, x.y.z)
  DEFAULT_FLAVOUR: debian-12

# Avoid concurrency over the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        openldap_version: [2.6.13, 2.6.14]
        flavour: [debian-12, debian-13]
        platform: [linux/amd64, linux/arm64]
        include:
          # AMD64 builds on standard Ubuntu runners
          - platform: linux/amd64
            label: ubuntu-24.04
          # ARM64 builds on native Arm runners
          - platform: linux/arm64
            label: ubuntu-24.04-arm
    runs-on: ${{ matrix.label }}
    
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get Git commit timestamps
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref != format('refs/heads/{0}', 'main') }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: bitnami/openldap/2.6/${{ matrix.flavour }}
          build-args: OPENLDAP_VERSION=${{ matrix.openldap_version }}
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE_NAME }}
          sbom: true
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
        env:
          SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.openldap_version }}-${{ matrix.flavour }}-${{ matrix.label }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        openldap_version: [2.6.13, 2.6.14]
        flavour: [debian-12, debian-13]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.openldap_version }}-${{ matrix.flavour }}-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Flavour-suffixed tags are published for every Debian flavour
            type=raw,value=${{ matrix.openldap_version }}-${{ matrix.flavour }}
            type=raw,value=2.6-${{ matrix.flavour }},enable=${{ matrix.openldap_version == env.LATEST_OPENLDAP_VERSION }}
            type=ref,event=branch,enable=${{ github.ref != format('refs/heads/{0}', 'main') }},suffix=-${{ matrix.flavour }}
            type=ref,event=pr,suffix=-${{ matrix.flavour }}
            # Unsuffixed tags are published only for the default flavour
            type=raw,value=${{ matrix.openldap_version }},enable=${{ matrix.flavour == env.DEFAULT_FLAVOUR }}
            type=raw,value=2.6,enable=${{ matrix.flavour == env.DEFAULT_FLAVOUR && matrix.openldap_version == env.LATEST_OPENLDAP_VERSION }}
            type=raw,value=latest,enable=${{ matrix.flavour == env.DEFAULT_FLAVOUR && matrix.openldap_version == env.LATEST_OPENLDAP_VERSION && '{{is_default_branch}}' || 'false' }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
